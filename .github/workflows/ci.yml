name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture type-check
        run: |
          npm run lint > typecheck.log 2>&1 || echo failed > typecheck.failed

      - name: Upload type-check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log

      - name: Type-check
        run: |
          cat typecheck.log
          test ! -f typecheck.failed

      - name: Build
        run: npm run build
